<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
        />

        <!-- PWA Meta Tags -->
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
        <meta name="description" content="AI-powered development assistant" />

        <!-- iOS PWA Meta Tags -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="HAPI" />
        <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

        <!-- Favicon -->
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />

        <!-- Safari Pinned Tab -->
        <link rel="mask-icon" href="/mask-icon.svg" color="#111827" />

        <!-- Prevent flash of white background on dark mode -->
        <style>
            html { background: #fff }
            @media (prefers-color-scheme: dark) {
                html { background: #1c1c1e; color-scheme: dark }
            }
        </style>
        <script>
            (function () {
                try {
                    var raw = localStorage.getItem('hapi-font-scale')
                    var scale = Number(raw)
                    if (scale === 0.8 || scale === 0.9 || scale === 1 || scale === 1.1 || scale === 1.2) {
                        document.documentElement.style.setProperty('--app-font-scale', String(scale))
                    }
                } catch (error) {
                    // Ignore storage errors.
                }
            })()
        </script>
        <script>
            (function () {
                var scheme = null
                try {
                    // Match useTheme: an explicit choice wins over the OS preference, otherwise the
                    // app flashes the wrong background for anyone who forced light or dark.
                    var stored = localStorage.getItem('hapi-appearance')
                    if (stored === 'dark' || stored === 'light') {
                        scheme = stored
                    }
                } catch (error) {
                    // Ignore storage errors.
                }
                if (!scheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    scheme = 'dark'
                }
                if (scheme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark')
                }
            })()
        </script>

        <!--
            Static shell painted before the bundle runs, so the launch of an installed PWA shows the
            app's frame instead of an empty page. main.tsx removes it once React has committed.
        -->
        <style>
            #app-shell {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                gap: 14px;
                padding: calc(env(safe-area-inset-top) + 14px) 14px 14px;
                background: #fff;
                transition: opacity 120ms ease-out;
            }
            #app-shell .app-shell-block {
                border-radius: 10px;
                background: rgba(0, 0, 0, 0.06);
                animation: app-shell-pulse 1.4s ease-in-out infinite;
            }
            #app-shell .app-shell-bar {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            #app-shell .app-shell-row {
                height: 56px;
            }
            @media (prefers-reduced-motion: reduce) {
                #app-shell .app-shell-block { animation: none }
            }
            @keyframes app-shell-pulse {
                0%, 100% { opacity: 1 }
                50% { opacity: 0.45 }
            }
            [data-theme='dark'] #app-shell {
                background: #1c1c1e;
            }
            [data-theme='dark'] #app-shell .app-shell-block {
                background: rgba(255, 255, 255, 0.08);
            }
        </style>

        <title>HAPI</title>
    </head>
    <body>
        <div id="root"></div>
        <div id="app-shell" aria-hidden="true">
            <div class="app-shell-bar">
                <div class="app-shell-block" style="height: 28px; width: 28px; border-radius: 999px"></div>
                <div class="app-shell-block" style="height: 18px; width: 40%"></div>
            </div>
            <div class="app-shell-block app-shell-row"></div>
            <div class="app-shell-block app-shell-row"></div>
            <div class="app-shell-block app-shell-row"></div>
            <div class="app-shell-block app-shell-row"></div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
