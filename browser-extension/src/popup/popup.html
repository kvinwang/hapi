<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #e0e0e0;
      background: #1e1e2e;
      padding: 16px;
    }
    h2 {
      font-size: 15px;
      margin-bottom: 12px;
      color: #cdd6f4;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f44336;
    }
    .status.connected { background: #4caf50; }
    label {
      display: block;
      font-size: 11px;
      color: #a6adc8;
      margin-bottom: 3px;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #45475a;
      border-radius: 6px;
      background: #313244;
      color: #cdd6f4;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #89b4fa; }
    .btn-row { display: flex; gap: 8px; margin-top: 14px; }
    button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-connect {
      background: #89b4fa;
      color: #1e1e2e;
    }
    .btn-connect:hover { background: #74c7ec; }
    .btn-disconnect {
      background: #f38ba8;
      color: #1e1e2e;
    }
    .btn-disconnect:hover { background: #eba0ac; }
    .info {
      margin-top: 12px;
      padding: 8px 10px;
      background: #313244;
      border-radius: 6px;
      font-size: 11px;
      color: #a6adc8;
    }
    .info strong { color: #cdd6f4; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>
    <span class="status" id="statusDot"></span>
    HAPI Browser Runner
  </h2>

  <div id="configForm">
    <label>Hub URL</label>
    <input type="text" id="hubUrl" placeholder="https://your-hub.example.com" value="https://hapi.kvin.wang">

    <label>Token</label>
    <input type="password" id="token" placeholder="API key or access token">

    <label>Machine ID <a href="#" id="genUuid" style="color:#89b4fa;text-decoration:none;font-size:10px">[generate]</a></label>
    <input type="text" id="machineId" placeholder="Click [generate] or paste UUID">

    <label>Machine Name</label>
    <input type="text" id="machineName" placeholder="My Browser" value="Browser">

    <div class="btn-row">
      <button class="btn-connect" id="btnConnect">Connect</button>
      <button class="btn-disconnect hidden" id="btnDisconnect">Disconnect</button>
    </div>
  </div>

  <div id="statusInfo" class="info hidden">
    <div><strong>Hub:</strong> <span id="infoHub"></span></div>
    <div><strong>Machine:</strong> <span id="infoMachine"></span></div>
    <div><strong>Tunnels:</strong> <span id="infoTunnels">0</span></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
