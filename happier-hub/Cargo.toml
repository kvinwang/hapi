[package]
name = "happier-hub"
version = "1.2.0"
edition = "2021"

[[bin]]
name = "happier-hub"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "macros", "ws"] }
base64 = "0.22"
cookie = "0.18"
dirs = "6"
figment = { version = "0.10", features = ["env", "json"] }
futures-util = "0.3"
headers = "0.4"
hex = "0.4"
hmac = "0.12"
http = "1"
jsonwebtoken = "9"
parking_lot = "0.12"
p256 = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socketioxide = { version = "0.18", features = ["extensions", "state", "tracing"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
web-push = "0.11"
