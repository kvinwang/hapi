name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install
            - run: bun run build:single-exe:all
            - name: Package release artifacts
              run: |
                  cd cli/dist-exe
                  mkdir -p ../release-artifacts

                  for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
                      name="hapi-${target#bun-}"
                      tar -czvf "../release-artifacts/${name}.tar.gz" -C "$target" hapi
                  done

                  cd ../release-artifacts
                  sha256sum * > checksums.txt
            - name: Create Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "${GITHUB_REF#refs/tags/}" \
                      --title "Release ${GITHUB_REF#refs/tags/}" \
                      --generate-notes \
                      cli/release-artifacts/*

    happier-linux:
        needs: release
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-musl
                    - target: aarch64-unknown-linux-musl
                    - target: i686-unknown-linux-musl
                    - target: armv7-unknown-linux-musleabihf
                    - target: arm-unknown-linux-musleabi
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - name: Install cross
              run: cargo install cross --git https://github.com/cross-rs/cross
            - name: Build happier
              working-directory: happier
              run: cross build --release --target ${{ matrix.target }}
            - name: Package and upload
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  mkdir staging
                  cp happier/target/${{ matrix.target }}/release/happier staging/happier
                  tar -czvf happier-${{ matrix.target }}.tar.gz -C staging happier
                  gh release upload "${GITHUB_REF#refs/tags/}" happier-${{ matrix.target }}.tar.gz

    happier-macos:
        needs: release
        runs-on: macos-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-apple-darwin
                    - target: aarch64-apple-darwin
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Build happier
              working-directory: happier
              run: cargo build --release --target ${{ matrix.target }}
            - name: Package and upload
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  mkdir staging
                  cp happier/target/${{ matrix.target }}/release/happier staging/happier
                  tar -czvf happier-${{ matrix.target }}.tar.gz -C staging happier
                  gh release upload "${GITHUB_REF#refs/tags/}" happier-${{ matrix.target }}.tar.gz

    happier-windows:
        needs: release
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-pc-windows-msvc
                    - target: aarch64-pc-windows-msvc
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Build happier
              working-directory: happier
              run: cargo build --release --target ${{ matrix.target }}
            - name: Package and upload
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  mkdir staging
                  cp happier/target/${{ matrix.target }}/release/happier.exe staging/happier.exe
                  cd staging && 7z a ../happier-${{ matrix.target }}.zip happier.exe
                  cd .. && gh release upload "${GITHUB_REF#refs/tags/}" happier-${{ matrix.target }}.zip
